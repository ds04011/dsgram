<!DOCTYPE html>
<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/static/css/style.css">
<title>Insert title here</title>
</head>

<body>
	
	<div id="wrap">
		<th:block th:replace="~{fragments/userheader}"></th:block>
		
		<div class="d-flex ">
			<div class="sidenav  ">
				 
				<nav class=" ">
	                <ul class="nav flex-column font-weight-bold pt-1">
	                    <li th:if="${session.userId!=null}" class="nav-item ml-3 my-2" th:text="|${session.nickname}님|">누구님</li>
	                    <li th:if="${session.userId==null}" class="nav-item ml-3 my-2" ><a href="/user/view/login">로그인</a></li>
	                    <li class="nav-item my-3"><a href="/post/view/create" class="nav-link bi bi-pencil-square" >글쓰기</a></li>
	                    <li class="nav-item my-3"><a href="/post/view/timeline" class="nav-link ">타임라인</a></li>
	                    <li class="nav-item my-3"><a href="/user/view/mypage" class="nav-link bi bi-card-list " >내 글 목록</a></li>
	                    <li th:if="${session.userId!=null}" class="nav-item my-3"><a href="/user/view/logout" class="nav-link ">로그아웃</a></li>
	                </ul>
            	</nav>
            	
			</div>
				
			<!-- <div class="main-contents bg-warning"></div>    이 위치가 사이드 내브바를 제외한 컨텐츠 위치니까, 
																여기다가 fragment 를 넣으면 되겠지?    -->
			<th:block layout:fragment="contents"></th:block>
		</div>
		
		
		
		<th:block th:replace="~{fragments/userfooter}"></th:block>
	</div>
	<!--  부트스트랩 또한 Jquery 기반이라, 잘 가져와야 하는데, 슬림버전 보다는 우리가 쓰고있는 정상버전이 좋음. -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
	<th:block layout:fragment="script"></th:block>
	

</body>
</html>
