<!DOCTYPE html>
<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/timelinedefault}">
        
        
        <section layout:fragment="contents">
        	<!-- 글쓰기 생성.  -->

       		<div class="main-contents my-3 p-5 d-flex flex-column justify-content-end">
       			<div class="inputdiv ">
	        		<h1 class="text-center">글 입력</h1>
	        		
	        		<textarea class="form-control mt-3" rows="10" placeholder="내용을 입력하세요" id="contentInput"></textarea>
	        		<input type="file" class="mt-3" id="fileInput">
	        		<div class="d-flex justify-content-center my-4">
	        			
	        			<button type = "button" class="btn btn-secondary btn-block" id="saveBtn">저장</button>
	        		</div>
        		</div>
       		</div>
        	
 	
        </section>
        
        <script layout:fragment="script">
        	$("#saveBtn").on("click", function(){
        		
        		let contents = $("#contentInput").val();
        		let file = $("#fileInput")[0].files[0];  
        		
        		if(contents==""){
        			alert("내용 입력하세요");
        			return;
        		}
        		
        		
        		let formData = new FormData();
        		formData.append("contents", contents);
        		formData.append("imageFile", file);
        		
        		$.ajax({
        			type:"post"
        			, url:"/post/create"
        			, data:formData
        			, enctype:"multipart/form-data"
        			, processData:false
        			, contentType:false
        			, success:function(response){
        				if(response.result=="success"){
        					location.href="/post/view/timeline";
        				} else {
        					alert("게시글 작성 실패");
        				}
        			}
        			, error:function(){
        				alert("글 작성중 통신 에러");
        			}
        			
        		});
        	});
        	
        
        </script>
        
</html>
